<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JP Smart IJFF 2026 - Pusat Konten User</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #FFF5F9;
      background-image: radial-gradient(#FFBFD9 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .fuji-banner {
      background: linear-gradient(135deg, #6E0038 0%, #B80058 55%, #E62E7A 100%);
      position: relative;
      overflow: hidden;
      border-bottom: 4px solid #F5C542;
    }
    .gold-gradient-text {
      background: linear-gradient(90deg, #FFE885, #F5C542, #FFF3B8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 pb-16">

  <!-- HEADER USER -->
  <header class="fuji-banner text-white shadow-lg">
    <svg class="absolute right-4 bottom-0 w-48 sm:w-64 opacity-25 pointer-events-none" viewBox="0 0 300 150" fill="none">
      <circle cx="210" cy="60" r="45" fill="#FF85B3"/>
      <path d="M20 150 L130 35 L175 35 L280 150 Z" fill="#4A0028"/>
      <path d="M130 35 L175 35 L195 65 L175 58 L160 70 L145 55 L130 68 L112 62 Z" fill="#FFFFFF"/>
    </svg>

    <div class="max-w-5xl mx-auto px-5 sm:px-8 py-7 relative z-10 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <span class="inline-block px-3 py-1 rounded-full bg-white/15 border border-white/25 text-xs font-semibold text-pink-100 mb-2">
          🌸 PORTAL MATERI PUBLIKASI
        </span>
        <h1 class="text-2xl sm:text-3xl font-extrabold">
          JP Smart <span class="gold-gradient-text">IJFF 2026</span>
        </h1>
        <p class="text-pink-100 text-xs sm:text-sm mt-1">Pilih kategori di bawah untuk melihat preview & download materi resmi</p>
      </div>

      <!-- Tombol Download Seluruh Konten -->
      <button onclick="downloadAllContents()" class="self-start sm:self-auto px-5 py-3 rounded-2xl bg-[#F5C542] hover:bg-[#eab528] text-[#6E0038] font-extrabold text-xs sm:text-sm shadow-md transition flex items-center gap-2">
        ⬇️ Download Semua Konten
      </button>
    </div>
  </header>

  <!-- CONTAINER UTAMA (Batas Kiri-Kanan Lega & Nyaman di HP) -->
  <main class="max-w-5xl mx-auto px-5 sm:px-8 mt-6 space-y-6">

    <!-- PILIHAN MENU KATEGORI KONTEN UNTUK USER -->
    <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
      <button onclick="selectUserCategory('Semua')" data-cat="Semua" class="user-cat-btn p-3.5 rounded-2xl bg-[#8B004B] text-white font-bold text-xs sm:text-sm shadow-sm transition flex flex-col items-center gap-1">
        <span class="text-xl">✨</span>
        <span>Semua Materi</span>
      </button>
      <button onclick="selectUserCategory('Story')" data-cat="Story" class="user-cat-btn p-3.5 rounded-2xl bg-white hover:bg-pink-50 text-[#8B004B] border border-pink-100 font-bold text-xs sm:text-sm shadow-sm transition flex flex-col items-center gap-1">
        <span class="text-xl">📱</span>
        <span>Story</span>
      </button>
      <button onclick="selectUserCategory('Feed')" data-cat="Feed" class="user-cat-btn p-3.5 rounded-2xl bg-white hover:bg-pink-50 text-[#8B004B] border border-pink-100 font-bold text-xs sm:text-sm shadow-sm transition flex flex-col items-center gap-1">
        <span class="text-xl">🖼️</span>
        <span>Feed</span>
      </button>
      <button onclick="selectUserCategory('Carousel')" data-cat="Carousel" class="user-cat-btn p-3.5 rounded-2xl bg-white hover:bg-pink-50 text-[#8B004B] border border-pink-100 font-bold text-xs sm:text-sm shadow-sm transition flex flex-col items-center gap-1">
        <span class="text-xl">🎠</span>
        <span>Carousel</span>
      </button>
      <button onclick="selectUserCategory('Materi Blasting')" data-cat="Materi Blasting" class="user-cat-btn col-span-2 sm:col-span-1 p-3.5 rounded-2xl bg-white hover:bg-pink-50 text-[#8B004B] border border-pink-100 font-bold text-xs sm:text-sm shadow-sm transition flex flex-col items-center gap-1">
        <span class="text-xl">📢</span>
        <span>Materi Blast</span>
      </button>
    </div>

    <!-- DAFTAR KONTEN USER -->
    <div id="userContentGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
  </main>

  <!-- POPUP PREVIEW KONTEN (HANYA BISA DITUTUP DENGAN TOMBOL "X") -->
  <div id="userPreviewModal" class="fixed inset-0 z-50 hidden bg-black/75 backdrop-blur-sm flex items-center justify-center p-5">
    <div class="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl border-2 border-[#F5C542]">
      <div class="bg-gradient-to-r from-[#6E0038] to-[#B80058] px-5 py-4 text-white flex items-center justify-between">
        <div class="truncate pr-3">
          <span id="uModalCategory" class="text-[11px] font-bold uppercase px-2.5 py-0.5 rounded-full bg-white/20"></span>
          <h3 id="uModalTitle" class="text-base font-bold mt-1 truncate"></h3>
        </div>
        <!-- Hanya tombol X ini yang menutup popup -->
        <button onclick="closeUserPreview()" title="Tutup"
          class="w-9 h-9 rounded-full bg-white text-[#8B004B] hover:bg-rose-100 font-extrabold text-lg flex items-center justify-center shadow shrink-0">
          ✕
        </button>
      </div>
      <div class="p-5 space-y-4 max-h-[80vh] overflow-y-auto">
        <div id="uModalMedia" class="rounded-2xl overflow-hidden bg-slate-100 flex items-center justify-center min-h-[220px]"></div>
        <p id="uModalCaption" class="text-sm text-slate-700 whitespace-pre-line bg-pink-50/60 p-3.5 rounded-xl border border-pink-100"></p>
        <a id="uModalDownloadBtn" href="#" target="_blank" download
          class="block w-full text-center py-3 rounded-xl bg-gradient-to-r from-[#8B004B] to-[#D6006E] text-white font-bold text-sm shadow">
          ⬇️ Download Materi Ini
        </a>
      </div>
    </div>
  </div>

  <script>
    // Tempelkan URL Web App Google Apps Script yang sama dengan Admin di sini
    const DEFAULT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyX4cLVzhR7MY13zOIWSOc3E_-esfm0SYjTyAdfi21eaSSV10BGfu2H6Sb9CmFgbEqKfQ/exec";
    const SCRIPT_URL = localStorage.getItem("JPSMART_SCRIPT_URL") || DEFAULT_SCRIPT_URL;

    let contents = [];
    let currentCategory = "Semua";

    const FALLBACK_CONTENTS = [
      {
        id: "DEMO-1",
        tanggal: "09 Nov 2026, 10:15",
        judul: "Carousel Panduan Registrasi JP Smart IJFF 2026",
        kategori: "Carousel",
        caption: "Slide panduan langkah demi langkah registrasi pengunjung JP Smart IJFF 2026.",
        fileName: "carousel-panduan-ijff.jpg",
        mimeType: "image/jpeg",
        viewUrl: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=900&q=80",
        downloadUrl: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1200&q=80"
      },
      {
        id: "DEMO-2",
        tanggal: "09 Nov 2026, 11:30",
        judul: "Story Countdown 7 Hari Menuju IJFF 2026",
        kategori: "Story",
        caption: "Gunakan stiker link pendaftaran resmi saat upload ke Instagram & WhatsApp Story.",
        fileName: "story-countdown-sakura.jpg",
        mimeType: "image/jpeg",
        viewUrl: "https://images.unsplash.com/photo-1528164344705-475426879c0d?auto=format&fit=crop&w=900&q=80",
        downloadUrl: "https://images.unsplash.com/photo-1528164344705-475426879c0d?auto=format&fit=crop&w=1200&q=80"
      },
      {
        id: "DEMO-3",
        tanggal: "09 Nov 2026, 13:00",
        judul: "Poster Utama Feed Instagram JP Smart",
        kategori: "Feed",
        caption: "Poster utama pengumuman booth dan promo spesial JP Smart di IJFF 2026.",
        fileName: "feed-poster-utama.jpg",
        mimeType: "image/jpeg",
        viewUrl: "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=900&q=80",
        downloadUrl: "https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=1200&q=80"
      },
      {
        id: "DEMO-4",
        tanggal: "09 Nov 2026, 14:10",
        judul: "Materi Blasting WhatsApp Komunitas Jepang",
        kategori: "Materi Blasting",
        caption: "Halo teman-teman! Jangan lewatkan keseruan JP Smart IJFF 2026 pekan ini.",
        fileName: "banner-blasting-wa.jpg",
        mimeType: "image/jpeg",
        viewUrl: "https://images.unsplash.com/photo-1545569341-9eb8b30979d9?auto=format&fit=crop&w=900&q=80",
        downloadUrl: "https://images.unsplash.com/photo-1545569341-9eb8b30979d9?auto=format&fit=crop&w=1200&q=80"
      }
    ];

    async function fetchUserContents() {
      if (!SCRIPT_URL) {
        const saved = localStorage.getItem("JPSMART_DEMO_ITEMS");
        contents = saved ? JSON.parse(saved) : FALLBACK_CONTENTS;
        renderUserGrid();
        return;
      }
      try {
        const res = await fetch(SCRIPT_URL);
        const json = await res.json();
        if (json.status === "success") {
          contents = json.data;
          renderUserGrid();
        }
      } catch (e) {
        console.error(e);
      }
    }

    function renderUserGrid() {
      const grid = document.getElementById("userContentGrid");
      const list = currentCategory === "Semua"
        ? contents
        : contents.filter(x => x.kategori === currentCategory);

      if (list.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full bg-white rounded-3xl p-10 text-center border border-pink-100">
            <p class="text-base font-bold text-[#8B004B]">Belum ada materi di kategori "${currentCategory}"</p>
          </div>`;
        return;
      }

      grid.innerHTML = list.map(item => `
        <div class="bg-white rounded-2xl shadow-sm hover:shadow-md border border-pink-100 overflow-hidden flex flex-col justify-between transition group">
          <div>
            <!-- Klik Thumbnail untuk Preview Popup -->
            <div onclick="openUserPreview('${item.id}')" class="relative h-48 bg-pink-50 cursor-pointer overflow-hidden">
              <img src="${item.viewUrl}" alt="${item.judul}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
              <span class="absolute top-3 left-3 px-3 py-1 rounded-full text-[11px] font-bold bg-[#8B004B]/90 text-white">
                ${item.kategori}
              </span>
              <div class="absolute inset-0 bg-black/25 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                <span class="px-3 py-1.5 rounded-full bg-white text-[#8B004B] font-bold text-xs shadow">🔍 Klik Preview</span>
              </div>
            </div>
            <div class="p-4">
              <p class="text-[11px] text-slate-400 font-medium">${item.tanggal}</p>
              <!-- Klik Judul untuk Preview Popup -->
              <h3 onclick="openUserPreview('${item.id}')" class="text-sm font-extrabold text-slate-800 hover:text-[#B80058] cursor-pointer mt-1 line-clamp-2 transition">
                ${item.judul}
              </h3>
              <p class="text-xs text-slate-500 mt-1.5 line-clamp-2">${item.caption || ""}</p>
            </div>
          </div>

          <div class="p-4 pt-0">
            <a href="${item.downloadUrl}" target="_blank" download="${item.fileName || item.judul}"
              class="block w-full text-center py-2.5 rounded-xl bg-pink-50 hover:bg-[#B80058] text-[#8B004B] hover:text-white font-bold text-xs transition">
              ⬇️ Download Materi
            </a>
          </div>
        </div>
      `).join("");
    }

    function selectUserCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll(".user-cat-btn").forEach(btn => {
        const active = btn.getAttribute("data-cat") === cat;
        btn.className = active
          ? "user-cat-btn p-3.5 rounded-2xl bg-[#8B004B] text-white font-bold text-xs sm:text-sm shadow-sm transition flex flex-col items-center gap-1"
          : "user-cat-btn p-3.5 rounded-2xl bg-white hover:bg-pink-50 text-[#8B004B] border border-pink-100 font-bold text-xs sm:text-sm shadow-sm transition flex flex-col items-center gap-1";
      });
      renderUserGrid();
    }

    function openUserPreview(id) {
      const item = contents.find(x => x.id === id);
      if (!item) return;
      document.getElementById("uModalCategory").textContent = item.kategori;
      document.getElementById("uModalTitle").textContent = item.judul;
      document.getElementById("uModalCaption").textContent = item.caption || "Tidak ada catatan caption.";
      document.getElementById("uModalDownloadBtn").href = item.downloadUrl;

      const mediaBox = document.getElementById("uModalMedia");
      if (item.mimeType && item.mimeType.startsWith("video/")) {
        mediaBox.innerHTML = `<video src="${item.downloadUrl}" controls class="w-full max-h-[380px] rounded-xl"></video>`;
      } else {
        mediaBox.innerHTML = `<img src="${item.viewUrl}" alt="${item.judul}" class="w-full max-h-[420px] object-contain" />`;
      }
      document.getElementById("userPreviewModal").classList.remove("hidden");
    }

    function closeUserPreview() {
      document.getElementById("uModalMedia").innerHTML = "";
      document.getElementById("userPreviewModal").classList.add("hidden");
    }

    function downloadAllContents() {
      const list = currentCategory === "Semua"
        ? contents
        : contents.filter(x => x.kategori === currentCategory);
      if (list.length === 0) {
        alert("Tidak ada konten untuk didownload.");
        return;
      }
      list.forEach((item, idx) => {
        setTimeout(() => {
          const a = document.createElement("a");
          a.href = item.downloadUrl;
          a.target = "_blank";
          a.download = item.fileName || `konten-${idx + 1}`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }, idx * 600);
      });
    }

    window.addEventListener("DOMContentLoaded", fetchUserContents);
  </script>
</body>
</html>
